<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Cadastro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="cadastro_style.css">
</head>
<body>
    <main>
        <div class="div_imagem">
            <img src="imagemLogin.png">
        </div>
        <div class="div_formulario">
            <h1>Cadastrar</h1>
            <div class="formulario">
                <input id="input_nome" type="text" placeholder="Nome">
                <input id="input_email" type="text" placeholder="E-mail">
                <input id="input_telefone" type="text" placeholder="Telefone">
                <input id="input_senha" type="password" placeholder="Senha">
            </div>
            
            <div class="div_cadastro">
                <button id="botao_cadastro" class="botao_cadastro">Cadastrar</button>
                <a href="login.html"><button class="botao_login">Já possui cadastro?</button></a>
            </div>
        </div>
    </main>
    <script src="casdastro_script.js"></script>
</body>
</html>
