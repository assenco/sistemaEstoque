<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="login_style.css">
</head>
<body>
    <main>
        <div class="div_imagem">
            <img src="imagemLogin.png">
        </div>
        <div class="div_login">
            <h1>Sign In</h1>
            <div class="formulario">
                <input id="input_email" type="text" placeholder="E-mail">
                <input id="input_senha" type="password" placeholder="Senha">
            </div>
            <!--No momento a opção de lembrar de mim e esqueceu a senha não possuem funcionalidade-->
            <div class="opcoes_login">
                <label>
                    <input type="checkbox"> Remember me
                </label>
                <button>Forgot Password?</button>
            </div>
            <div class="div_login">
                <button id="botao_login" class="botao_login">Login</button>
                <a href="cadastro.html"><button class="botao_cadastro">Não possui cadastro?</button></a>
            </div>
        </div>
    </main>
    <script src="login_script.js"></script>
</body>
</html>
